<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adam's Cookbook</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-content">
                <div class="header-text">
                    <h1>Adam's Cookbook</h1>
                    <p class="subtitle">Quick and easy recipes from my TikTok page</p>
                </div>
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search for recipes..." class="search-input">
                    <div class="search-results" id="searchResults"></div>
                </div>
            </div>
        </header>

        <main>
            <div class="recipe-feed">
                <!-- Recipe cards will be dynamically added here -->
            </div>
        </main>

    </div>
    <script src="script.js"></script>
</body>
</html>
