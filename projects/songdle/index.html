<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Songdle – Guess the Song</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-row">
        <span class="header-spacer"></span>
        <h1 class="title">Songdle</h1>
        <button class="stats-btn" id="statsBtn" aria-label="Statistics">
          <svg viewBox="0 0 24 24"><path d="M5 20h2V9H5v11zm4 0h2V4H9v16zm4 0h2v-8h-2v8zm4 0h2v-5h-2v5z"/></svg>
        </button>
      </div>
      <p class="mode-subtitle" id="modeSubtitle" hidden></p>
      <div class="genre-tabs">
        <button class="tab active" data-genre="all">All</button>
        <button class="tab" data-genre="rock">Rock</button>
        <button class="tab" data-genre="hip-hop">Hip-Hop</button>
        <button class="tab" data-genre="unlimited">Unlimited</button>
      </div>
      <div class="artist-filter-bar" id="artistFilterBar" hidden>
        <button class="artist-filter-btn" id="artistFilterBtn">All Artists &#9662;</button>
      </div>
    </header>

    <main>
      <div class="guess-slots" id="guessSlots"></div>

      <div class="timeline-wrapper">
        <div class="timeline-label" id="timelineLabel">0.1s</div>
        <div class="timeline" id="timeline"></div>
      </div>

      <div class="play-area">
        <button class="play-btn" id="playBtn" disabled aria-label="Play clip">
          <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>

      <div class="volume-area">
        <svg class="vol-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      </div>

      <div class="search-area">
        <div class="autocomplete-wrapper">
          <input
            type="text"
            id="searchInput"
            placeholder="Search for a song..."
            autocomplete="off"
            spellcheck="false"
            disabled
          >
          <ul class="autocomplete-list" id="autocompleteList" hidden role="listbox"></ul>
        </div>
        <button class="hint-btn" id="hintBtn" disabled>Hint</button>
        <button class="skip-btn" id="skipBtn" disabled>Skip</button>
      </div>

      <div class="hint-display" id="hintDisplay" hidden></div>

      <div class="status-msg" id="statusMsg"></div>
    </main>

    <div class="result-banner" id="resultBanner" hidden>
      <p class="result-title" id="resultTitle"></p>
      <p class="result-song" id="resultSong"></p>
      <button class="share-btn" id="shareBtn">Share Result</button>
      <div class="spotify-embed" id="spotifyEmbed" hidden></div>
      <button class="next-song-btn" id="nextSongBtn" hidden>Next Song &#8594;</button>
    </div>
  </div>

  <!-- Stats Modal -->
  <div class="modal-overlay" id="statsModal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Statistics</h2>
        <button class="modal-close" id="statsClose" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="stats-numbers" id="statsNumbers"></div>
      <p class="dist-heading">Guess Distribution</p>
      <div class="distribution" id="statsDistribution"></div>
    </div>
  </div>

  <!-- Artist Picker Modal -->
  <div class="modal-overlay" id="artistPickerModal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Filter by Artist</h2>
        <button class="modal-close" id="artistPickerClose" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <input type="text" class="artist-search-input" id="artistSearchInput" placeholder="Search artists..." autocomplete="off">
      <ul class="artist-list" id="artistPickerList"></ul>
    </div>
  </div>

  <script>window.SONGDLE_API = 'https://adamcamilleri-github-io.vercel.app';</script>
  <script src="script.js?v=9"></script>
</body>
</html>
