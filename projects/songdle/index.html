<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songdle – Guess the Song</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Songdle</h1>
        <p class="subtitle">Guess the song from short clips. Wrong guess = longer clip.</p>

        <div class="game-area">
            <div class="play-section">
                <button type="button" id="playBtn" class="play-btn" disabled>▶ Play (0.1s)</button>
                <p class="reveal-info" id="revealInfo">Attempt 1: 0.1 second</p>
            </div>

            <div class="guess-section">
                <input type="text" id="guessInput" placeholder="Artist – Song" autocomplete="off">
                <button id="submitBtn" class="submit-btn">Guess</button>
            </div>

            <div class="feedback" id="feedback"></div>
        </div>
    </div>
    <script>window.SONGDLE_API = 'https://adamcamilleri-github-io.vercel.app';</script>
    <script src="script.js?v=2"></script>
</body>
</html>
