<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Songdle – Guess the Song</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1 class="title">Songdle</h1>
      <div class="genre-tabs">
        <button class="tab active" data-genre="all">All</button>
        <button class="tab" data-genre="rock">Rock</button>
        <button class="tab" data-genre="hip-hop">Hip-Hop</button>
      </div>
    </header>

    <main>
      <div class="guess-slots" id="guessSlots"></div>

      <div class="timeline-wrapper">
        <div class="timeline-label" id="timelineLabel">1s</div>
        <div class="timeline" id="timeline"></div>
      </div>

      <div class="play-area">
        <button class="play-btn" id="playBtn" disabled aria-label="Play clip">
          <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>

      <div class="search-area">
        <div class="autocomplete-wrapper">
          <input
            type="text"
            id="searchInput"
            placeholder="Search for a song..."
            autocomplete="off"
            spellcheck="false"
            disabled
          >
          <ul class="autocomplete-list" id="autocompleteList" hidden role="listbox"></ul>
        </div>
        <button class="skip-btn" id="skipBtn" disabled>Skip</button>
      </div>

      <div class="status-msg" id="statusMsg"></div>
    </main>

    <div class="result-banner" id="resultBanner" hidden>
      <p class="result-title" id="resultTitle"></p>
      <p class="result-song" id="resultSong"></p>
    </div>
  </div>

  <script>window.SONGDLE_API = 'https://adamcamilleri-github-io.vercel.app';</script>
  <script src="script.js?v=5"></script>
</body>
</html>
