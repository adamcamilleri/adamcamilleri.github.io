<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handoff – AI Website Design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="handoff-app">
        <header class="handoff-header">
            <a href="../../index.html#projects" class="back-link"><i class="fas fa-arrow-left"></i> Back to portfolio</a>
            <h1>Handoff</h1>
            <p class="tagline">Describe your ideal website below and watch it come to life.</p>
        </header>

        <div class="two-panel">
            <aside class="panel chat-panel">
                <div class="panel-header">
                    <h2><i class="fas fa-comments"></i> Chat with your personal website editor</h2>
                </div>
                <div class="chat-messages" id="chatMessages">
                    <div class="message assistant">
                        <p>Describe the site you want: layout, colors, sections, copy. I’ll update the preview on the right as we go.</p>
                    </div>
                </div>
                <div class="chat-input-wrap">
                    <textarea id="chatInput" placeholder="e.g. Make a one-page portfolio with a dark header, hero with my name, and a contact form..." rows="2"></textarea>
                    <button type="button" id="sendBtn" class="send-btn" title="Send">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </aside>

            <section class="panel preview-panel">
                <div class="panel-header panel-header-actions">
                    <h2><i class="fas fa-desktop"></i> Live preview</h2>
                    <div class="header-actions">
                        <button type="button" id="editModeBtn" class="action-btn edit-mode-btn" title="Click sections to edit them">
                            <i class="fas fa-mouse-pointer"></i> Edit mode
                        </button>
                        <button type="button" id="saveBtn" class="action-btn" title="Save design to database">
                            <i class="fas fa-save"></i> Save
                        </button>
                        <button type="button" id="deployBtn" class="action-btn deploy-btn" title="Deploy to live URL">
                            <i class="fas fa-rocket"></i> Deploy
                        </button>
                    </div>
                </div>
                <div class="edit-selection-bar hidden" id="editSelectionBar">
                    <span class="edit-label">Change selected:</span>
                    <input type="text" id="editSelectionInput" placeholder="e.g. make this blue, add a cookie image here..." />
                    <button type="button" id="editApplyBtn" class="action-btn deploy-btn">Apply</button>
                </div>
                <div class="iframe-wrap">
                    <iframe id="previewFrame" title="Website preview" srcdoc=""></iframe>
                </div>
                <div class="deploy-result hidden" id="deployResult">
                    <p class="deploy-success"><i class="fas fa-check-circle"></i> Deployed! Your site is live:</p>
                    <a id="deployUrl" href="#" target="_blank" rel="noopener" class="deploy-url"></a>
                    <button type="button" id="copyUrlBtn" class="copy-btn"><i class="fas fa-copy"></i> Copy</button>
                </div>
            </section>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
