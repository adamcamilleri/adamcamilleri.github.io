<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adam's Town (beta)</title>
    <meta name="description" content="A walkable pixel-art town portfolio.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="../images/logo-ac.png">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #1a1726; font-family: "Inter", system-ui, sans-serif; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }

      .hud-top {
        position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0.9rem 1.2rem; font-size: 12px; letter-spacing: 0.04em; color: #f4ead2;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      }
      .hud-top a { color: #ffe0a0; text-decoration: none; pointer-events: auto; font-weight: 700; }
      .hud-hint { text-transform: uppercase; font-size: 11px; letter-spacing: 0.1em; opacity: 0.9; }

      /* dialog box, styled like a game text window */
      .box {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(12px);
        z-index: 6; width: min(560px, calc(100% - 32px)); pointer-events: none;
        background: #fbf6e9; color: #2a2118;
        border: 4px solid #3a2a1a; border-radius: 10px;
        box-shadow: 0 0 0 4px #c8a86a, 0 14px 40px rgba(0,0,0,0.5);
        padding: 14px 18px; opacity: 0; transition: opacity 0.15s ease, transform 0.15s ease;
        font-size: 15px; line-height: 1.5;
      }
      .box.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      .box-kicker { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #b8752a; font-weight: 800; margin-bottom: 3px; }
      .box-title { font-weight: 800; font-size: 17px; margin-bottom: 4px; }
      .box-cta { margin-top: 6px; font-size: 12px; color: #8a6a3a; font-weight: 700; }
      .box b { color: #b8752a; }

      .pad { display: none; }
      @media (hover: none), (pointer: coarse) {
        .pad { display: grid; position: fixed; left: 14px; bottom: 14px; z-index: 7; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 5px; }
        .pad button { border: 0; border-radius: 12px; background: rgba(20,16,32,0.66); color: #fff; font-size: 18px; touch-action: none; user-select: none; }
        .pad button:active { background: #c8a86a; }
        .pu { grid-column: 2; grid-row: 1; } .pl { grid-column: 1; grid-row: 2; } .pr { grid-column: 3; grid-row: 2; } .pd { grid-column: 2; grid-row: 3; }
        .pa { position: fixed; right: 18px; bottom: 24px; z-index: 7; width: 64px; height: 64px; border: 0; border-radius: 50%; background: #c8a86a; color: #2a2118; font-weight: 800; font-size: 14px; }
      }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div class="hud-top">
        <a href="../">&larr; Back</a>
        <span class="hud-hint">Arrow keys / WASD to walk &middot; Space at a door</span>
    </div>
    <div class="box" id="box">
        <div class="box-kicker" id="boxKicker"></div>
        <div class="box-title" id="boxTitle"></div>
        <div class="box-body" id="boxBody"></div>
        <div class="box-cta" id="boxCta"></div>
    </div>
    <div class="pad" aria-hidden="true">
        <button class="pu" data-dir="up">&#9650;</button>
        <button class="pl" data-dir="left">&#9664;</button>
        <button class="pr" data-dir="right">&#9654;</button>
        <button class="pd" data-dir="down">&#9660;</button>
    </div>
    <button class="pa" id="padA">A</button>
    <script src="town.js"></script>
</body>
</html>
