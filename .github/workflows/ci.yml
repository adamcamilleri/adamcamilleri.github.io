# Portfolio CI: structure checks plus the TaskMaster build
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate API structure
        run: |
          echo "Checking API endpoints exist..."
          test -f api/health.js && echo "api/health.js ok" || exit 1
          test -f api/songdle-songs.js && echo "api/songdle-songs.js ok" || exit 1
          test -f api/songdle-stream.js && echo "api/songdle-stream.js ok" || exit 1
          test -f api/soundcloud-daily.js && echo "api/soundcloud-daily.js ok" || exit 1
          echo "All API handlers present."

  querydesk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/querydesk
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        run: cd backend && python -m pytest

      - name: Build frontend
        run: cd frontend && npm install --no-fund --no-audit && npm run build

  taskmaster:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/taskmaster
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install TaskMaster dependencies
        run: npm ci

      - name: Lint TaskMaster
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build TaskMaster
        run: npm run build


